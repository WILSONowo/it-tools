server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 压缩:优先使用构建时预压缩的 .gz 文件(见 Dockerfile),其余文本资源实时压缩
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;

    # 入口与 SW 不缓存,保证发布即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 带内容哈希的构建产物:文件名变化即新版本,可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # FFmpeg 核心(约 32 MB)文件名不带版本号:每次使用前用 ETag 校验,未变化时只返回 304
    location /ffmpeg/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
